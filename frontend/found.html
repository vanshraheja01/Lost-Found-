<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Report Found Item</title>

    <link rel="stylesheet" href="found.css">

</head>


<body>

<div class="container">

<div class="form-card">

<a href="index.html" class="back">
← Back
</a>

<h1>Report Found Item</h1>

<p class="subtitle">
Upload a picture so the owner can identify it.
</p>


<form id="foundForm">


<label>Item Name</label>

<input
type="text"
id="itemName"
placeholder="Example: Black Wallet"
required>


<label>Category</label>

<select id="category" required>

<option value="">
Select category
</option>

<option>Electronics</option>
<option>Documents</option>
<option>Keys</option>
<option>Wallet</option>
<option>Books</option>
<option>Clothing</option>
<option>Other</option>

</select>


<label>Color</label>

<input
type="text"
id="color"
placeholder="Example: Black">


<label>Description</label>

<textarea
id="description"
placeholder="Describe what you found..."
required></textarea>


<label>Location Found</label>

<input
type="text"
id="location"
placeholder="Example: College Library">


<label>Date Found</label>

<input
type="date"
id="date">


<h2>Item Image</h2>


<div class="camera-area">

<video id="camera"
autoplay>
</video>

<canvas id="canvas"></canvas>

<button
type="button"
id="capture">
Take Picture
</button>

</div>


<label>Or Upload Image</label>

<input
type="file"
id="image"
accept="image/*">


<h2>Contact Information</h2>


<label>Your Name</label>

<input
type="text"
id="contactName"
required>


<label>Email</label>

<input
type="email"
id="email"
required>


<label>Phone</label>

<input
type="tel"
id="phone">


<button type="submit">
Report Found Item
</button>


</form>

</div>

</div>


<script src="found.js"></script>

</body>
