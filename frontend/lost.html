<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Report Lost Item</title>

    <link rel="stylesheet" href="lost.css">

</head>


<body>

    <div class="container">

        <div class="form-card">

            <a href="index.html" class="back">
                ← Back
            </a>

            <h1>Report Lost Item</h1>

            <p class="subtitle">
                Tell us about the item you lost.
            </p>


            <form id="lostForm">


                <label>Item Name</label>

                <input
                    type="text"
                    id="itemName"
                    placeholder="Example: Car Keys"
                    required>


                <label>Category</label>

                <select id="category" required>

                    <option value="">
                        Select category
                    </option>

                    <option>Electronics</option>

                    <option>Documents</option>

                    <option>Keys</option>

                    <option>Wallet</option>

                    <option>Books</option>

                    <option>Clothing</option>

                    <option>Other</option>

                </select>


                <label>Color</label>

                <input
                    type="text"
                    id="color"
                    placeholder="Example: Black"
                    required>


                <label>Description</label>

                <textarea
                    id="description"
                    placeholder="Describe your item..."
                    required></textarea>


                <label>Location Lost</label>

                <input
                    type="text"
                    id="location"
                    placeholder="Example: Library">


                <label>Date Lost</label>

                <input
                    type="date"
                    id="date">


                <h2>Contact Information</h2>


                <label>Your Name</label>

                <input
                    type="text"
                    id="contactName"
                    required>


                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    required>


                <label>Phone</label>

                <input
                    type="tel"
                    id="phone">


                <button type="submit">
                    Report Lost Item
                </button>


            </form>

        </div>

    </div>


    <script src="lost.js"></script>

</body>

</html>
